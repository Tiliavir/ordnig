# 00_Eingang/.ordnig/regeln.toml – optional. Paths are relative to the archive root.
# Unknown keys, broken patterns and missing folders stop the run (all errors listed).

# Folders that are not examples for incoming mail (photos, backups, old stuff).
ignorieren = ["70_Medien", "90_Backup"]

[schwellen]
k = 7              # neighbours that vote
anteil = 0.7       # winner's share of the vote weight
aehnlichkeit = 0.2 # minimum similarity of the closest document (0–1)

# Where {jahr} must not be the letter's date: group 1 is the year.
[jahr]
"20_Finanzen/0_Steuer/{jahr}" = '(?:Veranlagungszeitraum|Kalenderjahr|Steuerjahr)\s*:?\s*(\d{4})'

# First matching rule wins. Patterns are regular expressions, case-insensitive,
# matched against the file name and the text.
#   muster: one of them must match · alle: all must match · nicht: none may match
[[regel]]
name = "Lohnabrechnung"
ziel = "41_Arbeit/Arbeitgeber/Lohnabrechnung"
alle = ['Verdienstabrechnung|Lohnabrechnung', 'Arbeitgeber AG']

[[regel]]
name = "Bank"
ziel = "20_Finanzen/Bank/{jahr}"
muster = ['Beispielbank AG', '\bDE\d{2}1234\d{12}\b']
nicht = ['Werbung']
