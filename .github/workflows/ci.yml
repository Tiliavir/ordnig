name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/tiliavir/ordnig

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          python3 -m py_compile src/check.py src/migrate.py
          shellcheck src/ordnig tests/smoke.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ordnig:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (as non-root)
        run: |
          docker run --rm --user 1000:1000 -v "$PWD/tests:/tests:ro" \
            --entrypoint bash ordnig:test /tests/smoke.sh | tee smoke.log
          { echo '```'; tail -20 smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          v=$(cat VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "new=false"; else echo "new=true"; fi >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ steps.v.outputs.new == 'true' && format('{0}:{1}', env.IMAGE, steps.v.outputs.version) || '' }}
          cache-from: type=gha
      - name: Tag release
        if: steps.v.outputs.new == 'true'
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
