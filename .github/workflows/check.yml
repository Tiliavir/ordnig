name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command in a pipe fails the step

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: |
          python3 -m py_compile src/check.py src/migrate.py src/sort.py
          shellcheck src/ordnig tests/smoke.sh
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  smoke:
    name: Smoke test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ordnig:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Smoke test (as non-root)
        run: |
          docker run --rm --user 1000:1000 -v "$PWD/tests:/tests:ro" \
            --entrypoint bash ordnig:test /tests/smoke.sh | tee smoke.log
          { echo "### $(docker run --rm ordnig:test version | head -1)"; echo '```';
            docker run --rm ordnig:test version; tail -20 smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Image size
        if: matrix.arch == 'amd64'
        run: |
          size() { docker image inspect -f '{{.Size}}' "$1" | awk '{printf "%.0f MB", $1 / 1e6}'; }
          old=n/a
          if docker pull -q ghcr.io/tiliavir/ordnig:latest > /dev/null; then old=$(size ghcr.io/tiliavir/ordnig:latest); fi
          echo "Image size: $(size ordnig:test) (latest release: $old)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability scan
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 --no-progress ordnig:test
